<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gunshi Story - 武神とみロボ戦</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#071017;color:#fff;font-family:"Yu Gothic","Hiragino Kaku Gothic ProN",sans-serif}
body{min-height:100vh;display:grid;place-items:center;padding:18px}
.game{width:min(1100px,100%)}
.diffs{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
button{min-height:48px;padding:10px 24px;border-radius:9px;border:1px solid #d8bd72;background:linear-gradient(#344550,#121a20);color:#fff;font-weight:900;font-size:16px;cursor:pointer}
button.sel{outline:3px solid #6de3ff;background:linear-gradient(#1e6476,#102d37)}
button:disabled{opacity:.35;cursor:not-allowed}
.arena{position:relative;aspect-ratio:16/9;min-height:440px;overflow:hidden;border-radius:18px;border:2px solid #8ba5ae;background:#111;outline:none}
.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.vignette{position:absolute;inset:0;background:radial-gradient(circle at 50% 52%,transparent 35%,rgba(0,0,0,.4) 100%);pointer-events:none}
.hud{position:absolute;z-index:20;top:14px;left:14px;right:14px;display:flex;justify-content:space-between;gap:10px}
.box{min-width:150px;padding:8px 14px;text-align:center;border:1px solid #e4c56e;border-radius:8px;background:rgba(5,12,17,.84);text-shadow:0 2px 3px #000}
.box small{display:block;letter-spacing:.18em;color:#bcd8df}
.enemy{position:absolute;z-index:8;left:50%;top:48%;height:48%;max-width:62%;transform:translate(-50%,-50%);object-fit:contain;filter:drop-shadow(0 14px 12px rgba(0,0,0,.55));transition:transform .13s ease,filter .13s ease}
.enemy.ready{transform:translate(-50%,-50%) scale(1.04)}
.enemy.attack{transform:translate(-50%,-50%) scale(1.22);filter:drop-shadow(0 0 20px rgba(255,70,30,.8)) drop-shadow(0 16px 14px #000)}
.bang{position:absolute;z-index:30;left:50%;top:42%;transform:translate(-50%,-50%) scale(.2);opacity:0;font-size:clamp(90px,15vw,180px);font-weight:1000;color:#fff3a0;text-shadow:0 0 8px #fff,0 0 25px #ffc400,0 0 55px #ff3c00}
.bang.on{animation:bang .12s ease-out forwards}
.slash{position:absolute;z-index:26;left:-8%;right:-8%;top:49%;height:12px;background:white;border-radius:50%;opacity:0;box-shadow:0 0 8px white,0 0 24px #8eeaff,0 0 65px #22aaff;transform:rotate(-13deg) scaleX(0)}
.slash.on{animation:slash .18s ease-out}
.hurt{position:absolute;z-index:27;inset:0;opacity:0;background:radial-gradient(circle,transparent 20%,rgba(155,0,0,.92) 100%);pointer-events:none}
.hurt.on{animation:hurt .45s ease-out}
.result{position:absolute;z-index:31;left:50%;top:43%;transform:translate(-50%,-50%);font-size:clamp(34px,6vw,62px);font-weight:1000;opacity:0;text-shadow:0 4px 12px #000;white-space:nowrap}
.result.on{animation:result .7s ease-out}
.panel{position:absolute;z-index:35;left:5%;right:5%;bottom:14px;padding:12px 16px;border:3px solid #e7e3d6;outline:2px solid #11181b;border-radius:8px;background:rgba(4,10,14,.9)}
.msg{min-height:28px;text-align:center;font-family:"Yu Mincho","Hiragino Mincho ProN",serif;font-size:clamp(16px,2.2vw,22px);font-weight:900;text-shadow:0 2px 3px #000}
.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:9px}
.dodge{background:linear-gradient(#f3d886,#98691f);color:#171108}
.help{margin-top:5px;text-align:center;font-size:12px;color:#c8d4d9}
.end{position:absolute;z-index:50;inset:0;display:none;place-items:center;background:rgba(3,8,12,.88);text-align:center}
.end.show{display:grid}
.end h1{margin:0;font-family:Georgia,"Yu Mincho",serif;font-size:clamp(46px,9vw,90px);letter-spacing:.08em;color:#f6e1a1;text-shadow:0 0 25px #b67618}
.end p{font-size:20px;font-weight:800}
.history{margin:14px auto 18px;min-width:min(520px,86vw);max-width:620px;padding:12px 18px;border:1px solid #e4c56e;border-radius:10px;background:rgba(0,0,0,.35);font-size:17px;line-height:1.75;text-align:left}
.history .title{text-align:center;font-weight:900;color:#f6e1a1;margin-bottom:5px}
.history .row{display:flex;justify-content:space-between;gap:18px;border-bottom:1px solid rgba(255,255,255,.12)}
.history .row:last-child{border-bottom:0}
.history .time{font-weight:900;white-space:nowrap}
@keyframes bang{to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
@keyframes slash{0%{opacity:1;transform:rotate(-13deg) scaleX(0)}65%{opacity:1;transform:rotate(-13deg) scaleX(1)}100%{opacity:0;transform:rotate(-13deg) scaleX(1)}}
@keyframes hurt{0%{opacity:0}20%{opacity:1}100%{opacity:0}}
@keyframes result{0%{opacity:0;transform:translate(-50%,-50%) scale(.55)}25%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-70%) scale(1)}}
@media(max-width:650px){.arena{aspect-ratio:auto;height:620px}.hud{justify-content:center;flex-wrap:wrap}.box{min-width:100px;padding:6px 8px}.enemy{height:40%;top:49%}.panel{left:3%;right:3%}}
</style>
</head>

let diff="tomi",round=0,hits=0,state="idle",waitTimer=null,attackTimer=null,signalAt=0,reactionHistory=[];
// --- SOUND: Web Audio API（外部音源なし・HTML単体で動作） ---
let audioCtx=null,soundOn=true;
function audio(){if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==="suspended")audioCtx.resume();return audioCtx}
function tone(freq=440,dur=.08,type="sine",gain=.08,delay=0,endFreq=null){if(!soundOn)return;let a=audio(),t=a.currentTime+delay,o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(freq,t);if(endFreq)o.frequency.exponentialRampToValueAtTime(Math.max(20,endFreq),t+dur);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(gain,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g).connect(a.destination);o.start(t);o.stop(t+dur+.02)}
function noise(dur=.12,gain=.09,delay=0,highpass=700){if(!soundOn)return;let a=audio(),t=a.currentTime+delay,b=a.createBuffer(1,Math.ceil(a.sampleRate*dur),a.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);let src=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();src.buffer=b;f.type="highpass";f.frequency.value=highpass;g.gain.setValueAtTime(gain,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);src.connect(f).connect(g).connect(a.destination);src.start(t)}
const SFX={
 start(){tone(110,.18,"sawtooth",.05,0,220);tone(220,.22,"sine",.05,.08,440)},
 signal(){/* ズバァァン！：鋭い抜刀音＋低い衝撃＋余韻 */noise(.055,.24,0,2600);noise(.28,.16,.015,520);tone(1550,.075,"sawtooth",.10,0,210);tone(240,.24,"sawtooth",.13,.012,58);tone(92,.32,"sine",.12,.025,42);tone(720,.18,"triangle",.055,.035,180)},
 slash(){noise(.16,.14,0,900);tone(620,.12,"sawtooth",.05,0,150)},
 dodge(){noise(.10,.08,0,1800);tone(720,.08,"sine",.05,0,1180);tone(1180,.08,"sine",.04,.07,1650)},
 hit(){noise(.20,.16,0,120);tone(95,.22,"sawtooth",.11,0,45)},
 early(){tone(190,.11,"square",.07);tone(140,.16,"square",.06,.11)},
 clear(){[523,659,784,1047].forEach((f,i)=>tone(f,.16,"triangle",.07,i*.10))},
 over(){[330,247,196,131].forEach((f,i)=>tone(f,.22,"sawtooth",.055,i*.13))}
};
const q=s=>document.querySelector(s), arena=q(".arena"), enemy=q("#enemy"), bang=q("#bang"), slash=q("#slash"), hurt=q("#hurt"), result=q("#result"), msg=q("#msg"), roundEl=q("#round"), life=q("#life"), rt=q("#rt"), start=q("#start"), dodge=q("#dodge"), soundToggle=q("#soundToggle"), end=q("#end"), endTitle=q("#endTitle"), endText=q("#endText"), historyEl=q("#history");
function clearTimers(){clearTimeout(waitTimer);clearTimeout(attackTimer)}
function flash(el){el.classList.remove("on");void el.offsetWidth;el.classList.add("on")}
function update(){roundEl.textContent=round;life.textContent=hits===0?"● ●":hits===1?"● ○":"○ ○"}
function setEnemy(){enemy.src=cfg[diff].img;enemy.alt=cfg[diff].name}
function finish(win){clearTimers();state="end";dodge.disabled=true;end.classList.add("show");endTitle.textContent=win?"CLEAR":"GAME OVER";endText.textContent=win?"5回の猛攻をしのぎ切った！":"2回の斬撃を受け、訓練失敗……";historyEl.innerHTML=`<div class="title">リアクションタイム一覧</div>`+reactionHistory.map((r,i)=>`<div class="row"><span>第${i+1}撃</span><span class="time">${r}</span></div>`).join("");win?SFX.clear():SFX.over()}
function next(){if(hits>=2)return finish(false);if(round>=5)return finish(true);bang.classList.remove("on");enemy.classList.remove("attack");enemy.classList.add("ready");state="wait";dodge.disabled=false;msg.textContent="……敵の動きを見ろ。";let c=cfg[diff];waitTimer=setTimeout(signal,c.min+Math.random()*(c.max-c.min))}
function signal(){if(state!=="wait")return;SFX.signal();state="signal";signalAt=performance.now();enemy.classList.remove("ready");enemy.classList.add("attack");bang.classList.add("on");msg.textContent="！";attackTimer=setTimeout(()=>damage("遅い！ 斬撃を受けた！"),cfg[diff].window)}
function damage(text){if(state==="end")return;SFX.slash();SFX.hit();clearTimers();state="result";reactionHistory.push(cfg[diff].window+"ms超（被弾）");round++;hits++;update();bang.classList.remove("on");flash(slash);flash(hurt);result.textContent="DAMAGE";flash(result);msg.textContent=text;dodge.disabled=true;setTimeout(next,900)}
function act(){if(state==="wait"){SFX.early();SFX.hit();clearTimers();state="result";reactionHistory.push("フライング（被弾）");round++;hits++;update();flash(hurt);result.textContent="早い！";flash(result);msg.textContent="先に動いた！ ダメージ！";dodge.disabled=true;setTimeout(next,900);return}if(state!=="signal")return;SFX.slash();SFX.dodge();let ms=performance.now()-signalAt;clearTimers();state="result";reactionHistory.push(Math.round(ms)+" ms");round++;update();rt.textContent=Math.round(ms);bang.classList.remove("on");flash(slash);result.textContent=ms<160?"神回避！":ms<240?"回避！":"間一髪！";flash(result);msg.textContent="斬撃をかわした！";dodge.disabled=true;setTimeout(next,850)}
function begin(){audio();SFX.start();clearTimers();round=0;hits=0;reactionHistory=[];rt.textContent="---";update();end.classList.remove("show");setEnemy();start.disabled=true;next();arena.focus()}
document.querySelectorAll("[data-d]").forEach(b=>b.addEventListener("click",()=>{if(state==="wait"||state==="signal")return;diff=b.dataset.d;document.querySelectorAll("[data-d]").forEach(x=>x.classList.toggle("sel",x===b));setEnemy();msg.textContent="難易度「"+b.textContent+"」を選択。"}));
start.addEventListener("click",begin);q("#restart").addEventListener("click",begin);dodge.addEventListener("click",act);soundToggle.addEventListener("click",()=>{audio();soundOn=!soundOn;soundToggle.textContent=soundOn?"🔊 SOUND ON":"🔇 SOUND OFF";if(soundOn)tone(660,.07,"sine",.05)});
arena.addEventListener("keydown",e=>{if([" ","ArrowLeft","ArrowRight"].includes(e.key)){e.preventDefault();act()}});
setEnemy();update();
})();
</script>
</body></html>
